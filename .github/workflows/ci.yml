name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  frontend:
    name: frontend (react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
        env:
          CI: "true"
      # CRA inlines every REACT_APP_* variable, name and value, into the public
      # bundle, whether or not the code reads it. LINK_TOKEN unlocks feeds and
      # evidence pages, so it must never be there. Source maps are skipped:
      # they carry code comments, which may name the variable harmlessly.
      - name: The build carries no LINK_TOKEN
        run: |
          if grep -rIl --exclude='*.map' -e LINK_TOKEN -e 'token=' build/; then
            echo "The frontend build contains LINK_TOKEN or a ?token= link"
            exit 1
          fi

  docker:
    name: docker (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.example backend/.env
      - run: docker compose build
      - run: docker compose up --detach --wait --wait-timeout 180
      - run: curl --fail --silent --show-error http://localhost:5000/health
      - run: curl --fail --silent --show-error http://localhost:5000/watches
      # Watches this repo's own README; example.com asks not to be used for testing.
      # The scheduler may take the first snapshot at the same time (409) or
      # first ("no change"), so either is fine as long as one gets stored.
      - name: A real check works inside the backend container
        run: |
          curl --fail --silent --show-error http://localhost:5000/watches             -H 'Content-Type: application/json'             -d '{"url":"https://raw.githubusercontent.com/${{ github.repository }}/master/README.md","frequency":"daily"}' > watch.json
          id=$(node -p "require('./watch.json').id")
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --output check.json --write-out '%{http_code}' --max-time 90 -X POST "http://localhost:5000/watches/$id/check")
            [ "$status" = 200 ] && break
            echo "check answered $status: $(cat check.json)"; sleep 5
          done
          [ "$status" = 200 ]
          docker compose exec -T backend node -e "
            const db = require('better-sqlite3')('/data/watchdog.db', { readonly: true });
            const s = db.prepare('SELECT content, screenshot_path FROM snapshots WHERE watch_id = ?').get($id);
            if (!s || !/AI-Assisted-scraper/.test(s.content)) throw new Error('no snapshot of the README: ' + JSON.stringify(s).slice(0, 300));
            console.log('stored', s.content.length, 'chars, screenshot', s.screenshot_path);
          "
      - name: The frontend dev server answers
        run: timeout 180 bash -c 'until curl --fail --silent --output /dev/null http://localhost:3000; do sleep 3; done'
      - name: The backend writes the database and evidence under /data as a non-root user
        run: |
          docker compose exec -T backend node -e "
            const fs = require('fs');
            if (process.getuid() === 0) throw new Error('the backend runs as root');
            if (!fs.existsSync('/data/watchdog.db')) throw new Error('no database at /data/watchdog.db');
            fs.mkdirSync('/data/evidence', { recursive: true });
            fs.writeFileSync('/data/evidence/ci-probe', 'ok');
            fs.rmSync('/data/evidence/ci-probe');
            console.log('uid', process.getuid(), 'can write /data');
          "
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
